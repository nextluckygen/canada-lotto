name: Daily Lotto Post Generator

on:
  schedule:
    # 밴쿠버 PST 오전 8:00 (UTC 15:00) 매일 실행
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Lotto Generator Script
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-published daily lotto report & updated numbers [skip ci]"
          git push

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada Lotto Max Helper & Daily Analysis</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .lotto-ball {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-emerald-700 text-white py-8 px-4 shadow-md text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">🍁 Canada Lotto Max Helper</h1>
        <p class="text-sm sm:text-base mt-2 text-emerald-100">Daily Statistical Analysis & AI Number Generator (1-52)</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto p-4 sm:p-6 mt-4">
        
        <!-- Jackpot & Interactive Generator -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-emerald-100 text-center">
            <span class="inline-block bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2">Jackpot Alert</span>
            <h2 id="jackpot-amount" class="text-3xl sm:text-4xl font-black text-emerald-700">EST. $90 Million</h2>
            
            <hr class="my-5 border-slate-200">

            <h3 class="text-lg font-bold text-slate-700 mb-4">Today's Recommended Combination</h3>
            
            <!-- Lotto Balls Output Container -->
            <div id="balls-container" class="flex flex-wrap justify-center gap-2 sm:gap-3 mb-6 min-h-[50px]">
                <!-- Dynamic Lotto Balls -->
            </div>
            
            <button onclick="generateNewNumbers()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition duration-200 text-base">
                🔄 Generate Lucky Line
            </button>
        </div>

        <!-- Daily Post Content -->
        <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
            <h3 id="post-title" class="text-2xl font-bold text-slate-800 mb-4 border-b pb-3">Daily Analysis</h3>
            <div id="post-content" class="prose max-w-none text-slate-600 whitespace-pre-line leading-relaxed">
                Loading daily analysis...
            </div>
        </div>

    </main>

    <script>
        let currentPostData = null;

        // Ball color palette (Lotto Max Official style classification)
        function getBallColor(num) {
            if (num <= 10) return 'bg-red-500';
            if (num <= 20) return 'bg-blue-500';
            if (num <= 30) return 'bg-emerald-500';
            if (num <= 40) return 'bg-amber-500';
            return 'bg-purple-600';
        }

        function renderBalls(numbers) {
            const container = document.getElementById('balls-container');
            container.innerHTML = '';
            
            numbers.forEach(num => {
                const ball = document.createElement('div');
                ball.className = `lotto-ball ${getBallColor(num)}`;
                ball.innerText = num;
                container.appendChild(ball);
            });
        }

        // Generate instant new 7 random numbers (1-52) on button click
        function generateNewNumbers() {
            const numbers = [];
            while (numbers.length < 7) {
                const rand = Math.floor(Math.random() * 52) + 1;
                if (!numbers.includes(rand)) {
                    numbers.push(rand);
                }
            }
            numbers.sort((a, b) => a - b);
            renderBalls(numbers);
        }

        async function fetchData() {
            try {
                const response = await fetch('today_post.json?' + new Date().getTime());
                const data = await response.json();
                currentPostData = data;

                document.getElementById('jackpot-amount').innerText = "EST. " + data.jackpot;
                document.getElementById('post-title').innerText = data.title;
                document.getElementById('post-content').innerText = data.content;

                if (data.recommended_combination && Array.isArray(data.recommended_combination)) {
                    renderBalls(data.recommended_combination);
                } else {
                    generateNewNumbers();
                }
            } catch (error) {
                console.error("Error loading JSON data:", error);
                generateNewNumbers();
            }
        }

        fetchData();
    </script>
</body>
</html>
